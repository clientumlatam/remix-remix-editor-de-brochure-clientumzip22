kind = "web"
previewPath = "/"
title = "Clientum CRM"
version = "1.0.0"
id = "artifacts/clientum"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21496

[services.development]
run = "pnpm --filter @workspace/clientum run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clientum", "run", "build" ]
publicDir = "artifacts/clientum/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21496"
BASE_PATH = "/"
