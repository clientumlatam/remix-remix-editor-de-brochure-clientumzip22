<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientum Copilot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #f9fafb;
      color: #111827;
    }

    .header {
      background: linear-gradient(135deg, #1a3a6b 0%, #2467a2 100%);
      padding: 16px 20px 14px;
      color: white;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: white;
      flex-shrink: 0;
    }

    .subtitle {
      font-size: 11px;
      color: rgba(255,255,255,0.65);
      margin-top: 3px;
      padding-left: 36px;
    }

    .body {
      padding: 16px 20px 20px;
    }

    /* Login form */
    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: #111827;
      background: white;
      transition: border-color 0.15s;
      outline: none;
    }

    input:focus { border-color: #2563eb; }

    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }

    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: default; }

    .btn-secondary {
      width: 100%;
      background: transparent;
      color: #6b7280;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 12px;
    }

    .btn-secondary:hover { border-color: #ef4444; color: #ef4444; }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      margin-top: 8px;
    }

    .hidden { display: none; }

    /* Connected state */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #059669;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .tenant-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .tenant-name {
      font-weight: 700;
      font-size: 14px;
      color: #111827;
    }

    .tenant-email {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }

    .hint {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      background: #f0f7ff;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .hint strong { color: #1e40af; }

    .no-key-warn {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #92400e;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">C</div>
      Clientum Copilot
    </div>
    <div class="subtitle">Asistente IA para WhatsApp Web</div>
  </div>
  <div class="body">
    <div id="app"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
