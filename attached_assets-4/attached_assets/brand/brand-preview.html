<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clientum Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .fade-in { animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
    .line-clamp-2{
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 9999px; background: #DDDFE2; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 9999px; background: #031E43; cursor: pointer; border: 2px solid white;
    }
    input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 9999px; background: #031E43; cursor: pointer; border: 2px solid white; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const BRAND = {
    prussianBlue: '#031E43',
    duskBlue: '#3B506D',
    offWhite: '#FDFDFB',
    pureWhite: '#FFFFFF',
    alabasterGrey: '#DDDFE2',
    accentGreen: '#22D3A5',
    accentRed: '#FF4757'
  };

  const BASE_SCENES = [
    { id: 0, title: 'Apertura de marca', duration: 5, icon: '◆' },
    { id: 1, title: 'El caos administrativo', duration: 7, icon: '📞' },
    { id: 2, title: 'El costo real (Stats)', duration: 6, icon: '📊' },
    { id: 3, title: 'La solución integrada', duration: 7, icon: '🔄' },
    { id: 4, title: 'Bot de WhatsApp Activo', duration: 5, icon: '🤖' },
    { id: 5, title: 'Stack de tecnología', duration: 5, icon: '🌐' },
    { id: 6, title: 'Prueba social y confianza', duration: 5, icon: '★' },
    { id: 7, title: 'Llamado a la acción (CTA)', duration: 5, icon: '🚀' }
  ];

  const CAMPAIGN_TONES = {
    estandar: {
      name: 'Estándar (Corporativo Seguro)',
      scripts: [
        { visual: 'Logo Clientum aparece de forma fluida. Partículas sutiles de conexión tecnológica de fondo.', copy: 'Tu PyME merece trabajar con Inteligencia Artificial. No sin ella.' },
        { visual: 'Palabras y tareas administrativas se apilan caóticamente (WhatsApp, Facturas, Excel, Stock).', copy: 'Responder WhatsApps, cargar facturas, controlar stock... ¿Cuánto tiempo perdés en esto cada día?' },
        { visual: 'Aparecen métricas limpias y un cronómetro acelerando. “1.095 horas al año perdidas”.', copy: 'Son más de 3 horas diarias restadas a lo que de verdad hace crecer tu negocio.' },
        { visual: 'Flujo animado interactivo con flechas de conexión: WhatsApp → IA → CRM → ERP Clientum.', copy: 'Clientum conecta tus herramientas con IA avanzada. Todo automatizado y bajo control.' },
        { visual: 'Mockup de dispositivo móvil respondiendo un presupuesto automáticamente en 2 segundos.', copy: 'Tu negocio atiende, gestiona y califica clientes las 24 horas del día de forma automática.' },
        { visual: 'Se despliega la red de herramientas nativas integradas (n8n, WooCommerce, Dolibarr, Gemini).', copy: 'Tecnología de primer nivel optimizada para la realidad de las PyMEs argentinas.' },
        { visual: 'Tarjeta de testimonio real de cliente en Neuquén con calificación de 5 estrellas.', copy: '“Dejé de responder WhatsApps manualmente. El bot con IA lo hace mucho mejor que yo”.' },
        { visual: 'Llamado a la acción final con URL de Clientum, WhatsApp de contacto y botón pulsante.', copy: 'Pedí tu diagnóstico gratuito hoy. Diseñamos tu propuesta personalizada en 48 horas.' }
      ]
    },
    dramatico: {
      name: 'Dramático (Impacto y Dolor)',
      scripts: [
        { visual: 'Fondo oscuro con interferencias visuales premium. Logo estático de Clientum imponente.', copy: '¿Seguro que estás controlando tu PyME, o el desorden del día a día te controla a vos?' },
        { visual: 'Alertas rojas parpadeantes y notificaciones sin responder acumulándose en pantalla.', copy: 'Cada mensaje sin responder es dinero quemándose. Cada planilla manual es un error costoso.' },
        { visual: 'Frase de gran impacto visual: “El cansancio humano no escala”. Transición cinematográfica.', copy: 'No podés duplicar tus horas, pero sí podés multiplicar tu eficiencia con un sistema inteligente.' },
        { visual: 'Esquema ultra limpio donde desaparecen los pasos manuales y toma el control el backend inteligente.', copy: 'Inyectá Inteligencia Artificial real y liberá a tu equipo de la rutina operativa repetitiva.' },
        { visual: 'Un chatbot automatizado cerrando una venta de manera autónoma a las 3:15 AM de un día feriado.', copy: 'Recuperá tus fines de semana mientras tu sistema sigue facturando y respondiendo consultas sin pausa.' },
        { visual: 'Estructura de arquitectura blindada local sin plataformas costosas de licenciamiento en dólares.', copy: 'Automatización robusta, transparente y adaptada con precisión a la economía local.' },
        { visual: 'Cita contundente en tipografía destacada sobre el aumento del 200% en ventas automáticas.', copy: '“Pasamos de perder la mitad de los mensajes a procesar todo al instante. Nos cambió la vida”.' },
        { visual: 'Placa final limpia e imperativa invitando a la acción de auditoría estratégica inmediata.', copy: 'El desorden te cuesta caro. Reservá tu diagnóstico gratuito ahora y frená las pérdidas.' }
      ]
    },
    express: {
      name: 'Express (15s de Alta Conversión)',
      scripts: [
        { visual: 'Entrada directa y veloz con tipografía de alto impacto y transición dinámica.', copy: 'Dejá de contestar los mismos mensajes de WhatsApp una y otra vez.' },
        { visual: 'Flujo rápido de automatización integrando de forma instantánea el CRM y la Facturación AFIP.', copy: 'Clientum automatiza tus ventas, CRM y stock con Inteligencia Artificial real.' },
        { visual: 'Iconos de marcas y nubes de herramientas integrándose sin costuras en pantalla.', copy: 'Implementación ágil en 30 días, precios transparentes en pesos y sin sorpresas.' },
        { visual: 'Sticker interactivo de WhatsApp parpadeando y enlace de contacto directo en bio.', copy: 'Hacé clic abajo y obtené tu diagnóstico 100% gratuito hoy mismo.' },
        { visual: 'Enlace web de Clientum directo en pantalla.', copy: '¡Obtené tu diagnóstico gratuito hoy!' },
        { visual: 'Enlace web de Clientum directo en pantalla.', copy: '¡Obtené tu diagnóstico gratuito hoy!' },
        { visual: 'Enlace web de Clientum directo en pantalla.', copy: '¡Obtené tu diagnóstico gratuito hoy!' },
        { visual: 'Enlace web de Clientum directo en pantalla.', copy: '¡Obtené tu diagnóstico gratuito hoy!' }
      ]
    }
  };

  const hooksList = [
    '¿Cuántas horas por semana perdés con tareas de tu PyME que podría hacer una IA?',
    'Si tu negocio depende de vos para responder cada WhatsApp... no tenés un negocio, tenés un autoempleo.',
    '¿Sabías que las PyMEs que automatizan con IA crecen hasta 3 veces más rápido en Argentina?',
    'La forma en la que administrás tu stock y facturación está frenando tus ventas. Así se soluciona.'
  ];

  const state = {
    activeTab: 'video',
    tone: 'estandar',
    pymeName: 'Clientum',
    pymePhone: '+54 9 298 412-3456',
    priceBasic: '38.000',
    priceFull: '120.000',
    selectedHook: 0,
    manualHours: 3,
    hourlyCost: 4500,
    automationRate: 70,
    isPlaying: false,
    elapsed: 0,
    toast: { show: false, message: '' }
  };

  const app = document.getElementById('app');
  let rafId = null;
  let lastTime = performance.now();
  let toastTimeout = null;

  const sceneDurations = () => state.tone === 'express' ? [2,3,3,3,1,1,1,1] : BASE_SCENES.map(s => s.duration);
  const sceneTimes = () => {
    const times = [];
    let acc = 0;
    sceneDurations().forEach(d => { times.push(acc); acc += d; });
    return times;
  };
  const totalDuration = () => sceneDurations().reduce((a,b) => a + b, 0);

  const yearlyHoursSaved = () => Math.round(Math.round((state.manualHours * (state.automationRate / 100)) * 22) * 12);
  const monthlyHoursSaved = () => Math.round((state.manualHours * (state.automationRate / 100)) * 22);
  const dailySavingsInHours = () => (state.manualHours * (state.automationRate / 100)).toFixed(1);
  const monthlyMoneySaved = () => Math.round(monthlyHoursSaved() * state.hourlyCost);
  const yearlyMoneySaved = () => Math.round(yearlyHoursSaved() * state.hourlyCost);

  function triggerToast(message) {
    state.toast = { show: true, message };
    render();
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      state.toast = { show: false, message: '' };
      render();
    }, 2600);
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      triggerToast('¡Copiado con éxito al portapapeles!');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); triggerToast('¡Copiado con éxito al portapapeles!'); }
      catch { triggerToast('Error al copiar el texto.'); }
      document.body.removeChild(ta);
    }
  }

  function currentSceneIdx() {
    const times = sceneTimes();
    let idx = 0;
    for (let i = times.length - 1; i >= 0; i--) {
      if (state.elapsed >= times[i]) { idx = i; break; }
    }
    return idx;
  }

  function generatedCaption() {
    return `Si tu negocio todavía depende de vos para responder cada mensaje, procesar cada pedido y cargar cada factura... estás trabajando para el negocio, no al revés.

${state.pymeName} automatiza eso con Inteligencia Artificial real.
→ Bot de WhatsApp activo 24/7
→ CRM + ERP integrado (WooCommerce, AFIP, stock)
→ Sin plataformas caras de licenciamiento en dólares
→ Configuración a medida en menos de 30 días

Planes desde $${state.priceBasic}/mes. ¡Setup e implementación única disponible!

Pedí tu diagnóstico gratuito sin costo hoy mismo 👇
📲 Escribinos directamente por WhatsApp al ${state.pymePhone} o visitá clientum.com.ar`;
  }

  function handleDownloadPack() {
    const activeScript = CAMPAIGN_TONES[state.tone].scripts;
    const dateStr = new Date().toLocaleDateString('es-AR');
    const times = sceneTimes();
    const total = totalDuration();
    const caption = generatedCaption();
    const priceBasicNum = parseInt(String(state.priceBasic).replace(/\D/g, ''), 10) || 0;
    const fileContent = `======================================================================
CLIENTUM STUDIO - PACK DE CAMPAÑA AUTOMÁTICO & REPORTE DE ROI
Generado el ${dateStr} - Tono: ${CAMPAIGN_TONES[state.tone].name}
======================================================================

1. DIAGNÓSTICO ESTRATÉGICO Y ANÁLISIS DE ROI:
----------------------------------------------------------------------
* PyME Analizada: ${state.pymeName}
* Horas diarias perdidas en tareas manuales: ${state.manualHours} hs
* Costo por hora estimado: $${state.hourlyCost} ARS
* Tasa de automatización proyectada por Clientum: ${state.automationRate}%

* RESULTADOS DE OPTIMIZACIÓN ANUAL:
  - Tiempo recuperado al mes: ${monthlyHoursSaved()} horas.
  - Tiempo recuperado al año: ${yearlyHoursSaved()} horas de trabajo operativo.
  - Retorno económico mensual (Dinero recuperado): $${monthlyMoneySaved().toLocaleString('es-AR')} ARS
  - Retorno económico anual: $${yearlyMoneySaved().toLocaleString('es-AR')} ARS

* ANÁLISIS COMPARATIVO DE COSTOS:
  - Inversión mensual en Plan Básico: $${state.priceBasic}/mes
  - Retorno neto mensual estimado: $${(monthlyMoneySaved() - priceBasicNum).toLocaleString('es-AR')} ARS
  - Conclusión: El sistema se auto-financia en su primer mes de implementación.

======================================================================
2. GUION & STORYBOARD COMPLETO (Duración: ${total}s)
======================================================================
${BASE_SCENES.map((scene, idx) => {
  const sceneScript = activeScript[idx] || { visual: '', copy: '' };
  const actualCopy = idx === 0 ? hooksList[state.selectedHook] : sceneScript.copy;
  const startTime = times[idx];
  const endTime = times[idx] + sceneDurations()[idx];
  return `[ESCENA ${idx + 1}]: ${scene.title}
Tiempos: 0:${String(startTime).padStart(2, '0')}s a 0:${String(endTime).padStart(2, '0')}s
----------------------------------------------------------------------
- Acción Visual / B-Roll Sugerido: 
  ${sceneScript.visual}

- Texto en pantalla / Locución: 
  "${actualCopy}"

`;
}).join('\n')}

======================================================================
3. COPY/CAPTION SUGERIDO PARA INSTAGRAM / TIKTOK
======================================================================
${caption}

Hashtags recomendados:
#AutomatizacionIA #PyMEArgentina #WhatsAppBusiness #n8n #Patagonia #Clientum #EstrategiaDigital #CRM #ERP

======================================================================
Generado de forma oficial por Clientum Studio 2026.
clientum.com.ar - Tu PyME merece trabajar con IA. No sin ella.
======================================================================`;

    const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Propuesta_Clientum_${state.pymeName.replace(/\s+/g, '_')}_${state.tone}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    triggerToast('¡Propuesta con ROI y Pack de Campaña descargados con éxito!');
  }

  function setField(key, value) {
    state[key] = value;
    render();
  }

  function handlePrevScene() {
    const times = sceneTimes();
    const idx = currentSceneIdx();
    const prev = idx > 0 ? idx - 1 : times.length - 1;
    state.elapsed = times[prev];
    render();
  }

  function handleNextScene() {
    const times = sceneTimes();
    const idx = currentSceneIdx();
    const next = idx < times.length - 1 ? idx + 1 : 0;
    state.elapsed = times[next];
    render();
  }

  function renderIcon(name, cls='w-4 h-4') {
    return `<i data-lucide="${name}" class="${cls}"></i>`;
  }

  function logoSVG(cls='w-8 h-8') {
    return `
      <svg viewBox="0 0 100 100" class="${cls}" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="24" fill="${BRAND.prussianBlue}" />
        <path d="M50 25 L75 50 L50 75 L25 50 Z" stroke="${BRAND.pureWhite}" stroke-width="6" stroke-linejoin="round" />
        <circle cx="50" cy="25" r="8" fill="${BRAND.pureWhite}" />
        <circle cx="75" cy="50" r="8" fill="${BRAND.pureWhite}" />
        <circle cx="50" cy="75" r="8" fill="${BRAND.pureWhite}" />
        <circle cx="25" cy="50" r="8" fill="${BRAND.pureWhite}" />
      </svg>`;
  }

  function toastHTML() {
    if (!state.toast.show) return '';
    return `
      <div class="fixed bottom-5 right-5 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg border text-sm font-semibold text-white fade-in" style="background:${BRAND.prussianBlue}; border-color:${BRAND.duskBlue}">
        ${renderIcon('check-circle-2', 'w-4 h-4')}
        ${state.toast.message}
      </div>`;
  }

  function videoPanel() {
    const idx = currentSceneIdx();
    const times = sceneTimes();
    const total = totalDuration();
    const activeScript = CAMPAIGN_TONES[state.tone].scripts;
    const currentCopy = idx === 0 ? hooksList[state.selectedHook] : activeScript[idx].copy;

    return `
      <div class="flex flex-col gap-6 fade-in">
        <div class="rounded-2xl overflow-hidden border shadow-lg" style="background:${BRAND.prussianBlue}; border-color:${BRAND.duskBlue}">
          <div id="player" class="relative w-full aspect-video flex flex-col items-center justify-center p-6 md:p-12 text-center select-none cursor-pointer overflow-hidden transition-all duration-300" style="background: radial-gradient(circle, ${BRAND.duskBlue} 0%, ${BRAND.prussianBlue} 90%)">
            <div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:24px_24px]"></div>

            <div class="absolute top-4 left-4 flex items-center gap-2 opacity-85">
              ${logoSVG('w-6 h-6')}
              <span class="text-xs font-extrabold tracking-widest text-white uppercase">${escapeHTML(state.pymeName)} IA</span>
            </div>

            <div class="absolute top-4 right-4 text-[10px] font-mono px-2 py-1 rounded bg-black bg-opacity-30 text-white">Escena ${idx + 1}/8 · ${formatTime(state.elapsed)}s</div>

            <div class="flex flex-col items-center gap-4 max-w-xl transition-all duration-300">
              ${idx === 0 ? `
                <div class="space-y-3">
                  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-extrabold tracking-wider text-white uppercase bg-white bg-opacity-20 animate-pulse">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    ${escapeHTML(state.pymeName)} AUTOMATIZACIONES
                  </span>
                  <h2 class="text-xl md:text-3xl font-extrabold text-white leading-tight">${escapeHTML(currentCopy)}</h2>
                  <p class="text-xs text-white opacity-70 italic">[Logo Clientum animándose y flotando en pantalla]</p>
                </div>` : ''}

              ${idx === 1 ? `
                <div class="space-y-4 w-full">
                  <h3 class="text-xs font-bold tracking-widest uppercase text-white opacity-90">EL CAOS COTIDIANO EN TU PyME</h3>
                  <div class="grid grid-cols-3 gap-2 text-[10px] font-bold text-white">
                    ${['📞 Responder Consultas','📑 Cargar Facturas AFIP','📊 Controlar Planillas','📦 Sincronizar Stock','📱 WhatsApp Colapsado','⏱️ Tiempo Perdido'].map(t=>`<div class="p-2.5 rounded-lg bg-red-950 bg-opacity-40 border border-red-500 border-opacity-30">${t}</div>`).join('')}
                  </div>
                  <p class="text-xs text-red-300 font-semibold">${escapeHTML(currentCopy)}</p>
                </div>` : ''}

              ${idx === 2 ? `
                <div class="space-y-2">
                  <span class="text-xs font-bold text-red-400 uppercase tracking-wide">EL COSTO ADMINISTRATIVO</span>
                  <div class="text-4xl md:text-5xl font-black text-white leading-none">${yearlyHoursSaved()} Horas</div>
                  <p class="text-sm font-bold text-white opacity-90">perdidas al año en tareas que podría hacer una IA.</p>
                  <p class="text-xs text-white opacity-70 italic">[Métrica y cronómetro en pantalla simulando el tiempo muerto]</p>
                </div>` : ''}

              ${idx === 3 ? `
                <div class="space-y-4 w-full">
                  <span class="text-xs font-bold tracking-wider text-green-300 uppercase">La Solución Integrada</span>
                  <div class="flex items-center justify-center gap-2 text-xs font-bold text-white">
                    <div class="px-3 py-1.5 rounded bg-white bg-opacity-10 border border-white border-opacity-20">WhatsApp</div>
                    <span class="opacity-50">→</span>
                    <div class="px-3 py-1.5 rounded bg-white bg-opacity-25 border border-white">IA</div>
                    <span class="opacity-50">→</span>
                    <div class="px-3 py-1.5 rounded bg-white bg-opacity-10 border border-white border-opacity-20">CRM</div>
                  </div>
                  <p class="text-sm font-bold text-white leading-relaxed">${escapeHTML(currentCopy)}</p>
                </div>` : ''}

              ${idx === 4 ? `
                <div class="space-y-3 w-full max-w-xs bg-black bg-opacity-40 p-3.5 rounded-2xl border border-white border-opacity-10 text-left">
                  <div class="flex items-center gap-2 border-b border-white border-opacity-10 pb-1.5 mb-1.5">
                    <div class="w-2 h-2 rounded-full bg-green-500"></div>
                    <span class="text-[10px] text-white font-bold">Bot Clientum IA Activo</span>
                  </div>
                  <div class="space-y-1.5">
                    <div class="bg-white bg-opacity-10 text-white p-2 rounded-lg rounded-tl-none text-[10px] max-w-[80%]">¿Tienen stock disponible en este momento?</div>
                    <div class="bg-[#3B506D] text-white p-2 rounded-lg rounded-tr-none text-[10px] max-w-[80%] ml-auto text-right">¡Sí! Stock sincronizado en tiempo real. ¿Querés reservar?</div>
                  </div>
                </div>` : ''}

              ${idx === 5 ? `
                <div class="space-y-3">
                  <h3 class="text-xs font-bold tracking-widest text-white uppercase">TECNOLOGÍA REAL SIN HUMO</h3>
                  <div class="flex flex-wrap gap-1.5 justify-center max-w-sm">
                    ${['n8n','WooCommerce','AFIP','Evolution API','Gemini'].map(t=>`<span class="px-2.5 py-1 bg-white bg-opacity-15 rounded text-[9px] font-bold text-white border border-white border-opacity-10">${t}</span>`).join('')}
                  </div>
                  <p class="text-xs text-white opacity-80 leading-relaxed">${escapeHTML(currentCopy)}</p>
                </div>` : ''}

              ${idx === 6 ? `
                <div class="space-y-1 bg-white bg-opacity-10 p-4 rounded-xl border border-white border-opacity-10 max-w-xs">
                  <div class="text-yellow-400 text-xs">★★★★★</div>
                  <p class="text-[10px] italic text-white leading-normal">${escapeHTML(currentCopy)}</p>
                  <span class="block text-[8px] uppercase font-bold text-white opacity-60">— Distribuidora Patagónica, Neuquén</span>
                </div>` : ''}

              ${idx === 7 ? `
                <div class="space-y-3">
                  <h3 class="text-xl font-extrabold text-white">Diagnóstico Gratuito</h3>
                  <p class="text-[11px] text-white opacity-85 leading-normal max-w-xs mx-auto">${escapeHTML(currentCopy)}</p>
                  <div class="inline-block px-3 py-1.5 bg-white text-[#031E43] text-[10px] font-extrabold rounded-full shadow-md uppercase tracking-wide">📲 WhatsApp: ${escapeHTML(state.pymePhone)}</div>
                </div>` : ''}
            </div>
          </div>

          <div id="progressBar" class="h-1.5 w-full cursor-pointer relative" style="background-color: rgba(255,255,255,0.1)">
            <div class="h-full transition-all duration-100" style="width:${(state.elapsed / total) * 100}%; background:${BRAND.pureWhite}"></div>
            ${times.slice(1).map(t => `<div class="absolute top-0 w-0.5 h-full bg-black bg-opacity-30" style="left:${(t / total) * 100}%"></div>`).join('')}
          </div>

          <div class="px-6 py-4 flex items-center justify-between gap-4 text-white">
            <div class="flex items-center gap-3">
              <button id="playBtn" class="p-2 rounded-full hover:bg-white hover:bg-opacity-10 transition text-white">${state.isPlaying ? renderIcon('pause', 'w-4 h-4') : renderIcon('play', 'w-4 h-4')}</button>
              <button id="resetBtn" class="p-2 rounded-full hover:bg-white hover:bg-opacity-10 transition text-white" title="Reiniciar">${renderIcon('rotate-ccw', 'w-3.5 h-3.5')}</button>
              <div class="text-xs font-mono opacity-85">${formatTime(state.elapsed)} / ${formatTime(total)}</div>
            </div>
            <div class="flex items-center gap-1.5">${sceneDurations().map((_, i)=>`<button data-scene-dot="${i}" class="w-2 h-2 rounded-full transition-all" style="background:${idx===i?BRAND.pureWhite:'rgba(255,255,255,0.3)'}; transform:${idx===i?'scale(1.2)':'scale(1)'}"></button>`).join('')}</div>

    const progressBar = document.getElementById('progressBar'); if (progressBar) progressBar.onclick = (e) => { const rect = progressBar.getBoundingClientRect(); const pct = (e.clientX - rect.left) / rect.width; state.elapsed = pct * totalDuration(); render(); };
    const playBtn = document.getElementById('playBtn'); if (playBtn) playBtn.onclick = () => { state.isPlaying = !state.isPlaying; render(); };
    const resetBtn = document.getElementById('resetBtn'); if (resetBtn) resetBtn.onclick = () => { state.elapsed = 0; state.isPlaying = false; render(); };
    const prevScene = document.getElementById('prevScene'); if (prevScene) prevScene.onclick = handlePrevScene;
    const nextScene = document.getElementById('nextScene'); if (nextScene) nextScene.onclick = handleNextScene;
    document.querySelectorAll('[data-scene-dot]').forEach(btn => btn.onclick = () => { state.elapsed = sceneTimes()[Number(btn.dataset.sceneDot)]; render(); });
    document.querySelectorAll('[data-scene-row]').forEach(row => row.onclick = () => { state.elapsed = sceneTimes()[Number(row.dataset.sceneRow)]; render(); });
  }

  function animate(now) {
    if (state.isPlaying) {
      const delta = (now - lastTime) / 1000;
      state.elapsed += delta;
      if (state.elapsed >= totalDuration()) state.elapsed = 0;
      render();
    }
    lastTime = now;
    rafId = requestAnimationFrame(animate);
  }

  function render(rebind = true) {
    app.innerHTML = mainHTML() + toastHTML();
    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    if (rebind) bindEvents();
  }

  render();
  rafId = requestAnimationFrame(animate);
})();
</script>
</body>
</html>
