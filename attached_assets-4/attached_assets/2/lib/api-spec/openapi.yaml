components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Contact:
      type: object
      required: [id, name, email, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        companyId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive, prospect]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ContactInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        company:
          type: string
        companyId:
          type: integer
        status:
          type: string
          enum: [active, inactive, prospect]
        notes:
          type: string

    ContactUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        company:
          type: string
        companyId:
          type: integer
        status:
          type: string
          enum: [active, inactive, prospect]
        notes:
          type: string

    Company:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        contactCount:
          type: integer
        createdAt:
          type: string

    CompanyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        industry:
          type: string
        size:
          type: string
        website:
          type: string
        address:
          type: string
        notes:
          type: string

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        size:
          type: string
        website:
          type: string
        address:
          type: string
        notes:
          type: string

    Lead:
      type: object
      required: [id, title, stage, value, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        contactId:
          type: ["integer", "null"]
        contactName:
          type: ["string", "null"]
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        stage:
          type: string
          enum: [new, contacted, qualified, proposal, negotiation, won, lost]
        value:
          type: number
        source:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    LeadInput:
      type: object
      required: [title, stage, value]
      properties:
        title:
          type: string
        contactId:
          type: integer
        companyId:
          type: integer
        stage:
          type: string
          enum: [new, contacted, qualified, proposal, negotiation, won, lost]
        value:
          type: number
        source:
          type: string
        notes:
          type: string

    LeadUpdate:
      type: object
      properties:
        title:
          type: string
        contactId:
          type: integer
        companyId:
          type: integer
        stage:
          type: string
          enum: [new, contacted, qualified, proposal, negotiation, won, lost]
        value:
          type: number
        source:
          type: string
        notes:
          type: string

    Deal:
      type: object
      required: [id, title, stage, value, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        contactId:
          type: ["integer", "null"]
        contactName:
          type: ["string", "null"]
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        stage:
          type: string
          enum: [discovery, proposal, negotiation, contract, closed_won, closed_lost]
        value:
          type: number
        probability:
          type: ["number", "null"]
        expectedCloseDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    DealInput:
      type: object
      required: [title, stage, value]
      properties:
        title:
          type: string
        contactId:
          type: integer
        companyId:
          type: integer
        stage:
          type: string
          enum: [discovery, proposal, negotiation, contract, closed_won, closed_lost]
        value:
          type: number
        probability:
          type: number
        expectedCloseDate:
          type: string
        notes:
          type: string

    DealUpdate:
      type: object
      properties:
        title:
          type: string
        contactId:
          type: integer
        companyId:
          type: integer
        stage:
          type: string
          enum: [discovery, proposal, negotiation, contract, closed_won, closed_lost]
        value:
          type: number
        probability:
          type: number
        expectedCloseDate:
          type: string
        notes:
          type: string

    Activity:
      type: object
      required: [id, type, title, date, completed, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [call, email, meeting, task, note]
        title:
          type: string
        contactId:
          type: ["integer", "null"]
        contactName:
          type: ["string", "null"]
        dealId:
          type: ["integer", "null"]
        dealTitle:
          type: ["string", "null"]
        date:
          type: string
        completed:
          type: boolean
        notes:
